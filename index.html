<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мова вільних і небайдужих</title>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
@font-face{font-family:BalsamiqLocal;font-weight:400;src:local("Balsamiq Sans"),url(fonts/BalsamiqSans-Regular.ttf) format("truetype")}
@font-face{font-family:BalsamiqLocal;font-weight:700;src:local("Balsamiq Sans Bold"),url(fonts/BalsamiqSans-Bold.ttf) format("truetype")}
/* Кольори школи (vilni.school): помаранчевий #f15e38, лавандовий #ecebfb, персиковий #f7e6e1, жовтий #f6d58e.
   Тема «Вирізки» = класи body.v1 (бульбашки) + v8 (скрапбук) + v14 (вирізки). */
:root{--o:#f15e38;--od:#c9441d;--ot:#fff1ec;--ink:#111;--mut:#666;--pa:#fffaf6;--cd:#fff;--ln:#111;--bw:.35vh;--sh:.7vh .7vh 0 #111;--ss:.45vh .45vh 0 #111;--sel:#111;--selt:#fff;--lg:#111;--lgt:#fff;--go:#f15e38;--got:#111;--rad:3vh;--dot:rgba(17,17,17,.11);--ring:#f15e38}
*{box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100vh;overflow:hidden;color:var(--ink);font-family:BalsamiqLocal,"Balsamiq Sans","Segoe UI",system-ui,sans-serif;background-color:var(--pa);background-image:radial-gradient(circle,var(--dot) .2vh,transparent .26vh);background-size:3.2vh 3.2vh}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
button:disabled{cursor:default;opacity:.45}
#app{height:100vh;padding:3vh 3vw;position:relative}
.card{background:var(--cd);border:var(--bw) solid var(--ln);border-radius:var(--rad);padding:2.2vh 1.8vw;box-shadow:var(--sh)}
.home{display:grid;grid-template-columns:5fr 7fr;gap:2.6vw;height:100%}
@media(max-aspect-ratio:1/1){.home{grid-template-columns:1fr;overflow:auto}}
.hero{display:flex;flex-direction:column;gap:2vh;justify-content:center;min-height:0}
.logo{align-self:flex-start;position:relative;background:var(--lg);color:var(--lgt);font-size:3.9vh;font-weight:700;line-height:1.12;padding:1.5vh 1.8vw 1.7vh;border-radius:3.4vh;transform:rotate(-1.2deg);margin-bottom:1vh}
.logo.s{font-size:4.2vh;margin-bottom:2vh}
/* Назва-прапорець: літери хвилею, по тканині біжать складки */
/* --t (з home()) — щоб після перемальовування екрана анімація не починалася спочатку */
.logo.flag{font-size:5.6vh;padding:1.8vh 2vw 2vh;overflow:hidden;transform-origin:0 50%;animation:flap 3.2s ease-in-out infinite;animation-delay:var(--t,0s)}
.flag .w{display:inline-block;white-space:nowrap}.flag .w>i{display:inline-block;font-style:normal;animation:wave 1.6s ease-in-out infinite;animation-delay:calc(var(--t,0s) + var(--i)*-.09s)}
.flag::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0,rgba(255,255,255,.22) 7%,rgba(255,255,255,0) 14%,rgba(0,0,0,.1) 21%,rgba(255,255,255,0) 28%);background-size:200% 100%;animation:folds 2.4s linear infinite;animation-delay:var(--t,0s)}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-.55vh) rotate(-2deg)}75%{transform:translateY(.45vh) rotate(1.5deg)}}
@keyframes flap{0%,100%{transform:rotate(-3deg) skewY(0)}50%{transform:rotate(-3deg) skewY(-1.4deg) scaleX(.985)}}
@keyframes folds{to{background-position:-200% 0}}
/* Гасло — під тим самим кутом, із м’яким світінням по контуру */
.slogan{align-self:flex-start;font-size:3.3vh;font-weight:700;line-height:1.2;color:#2b2840;background:#fff;padding:1.1vh 1.6vw;border-radius:2.2vh;margin:-.4vh 0 0 1.4vw;transform:rotate(-3deg);animation:glow 2.6s ease-in-out infinite,bob 3.2s ease-in-out infinite;animation-delay:var(--t,0s),var(--t,0s)}
.slogan b{color:#f15e38}
@keyframes glow{0%,100%{box-shadow:0 0 0 .3vh #f15e38,0 0 .8vh rgba(241,94,56,.35)}50%{box-shadow:0 0 0 .3vh #f6b84a,0 0 2.4vh rgba(241,94,56,.75)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -.5vh}}
@media(prefers-reduced-motion:reduce){.flag,.flag *,.flag::after,.slogan{animation:none!important}}
.sub{font-size:2.6vh;color:var(--mut);margin:0}
.duo{display:grid;grid-template-columns:1.35fr 1fr;gap:1.4vw}
.rules{font-size:1.8vh;line-height:1.35}.rules b{display:block;font-size:2.5vh;margin-bottom:.6vh}.rules ul{margin:0;padding-left:1.2em}.rules li{margin:.25vh 0}
.wod{display:flex;flex-direction:column;align-items:flex-start;gap:.4vh}
.wod span{background:var(--o);color:#111;font-size:2vh;font-weight:700;padding:.4vh 1vw;border-radius:2vh}
.wod b{font-size:4.6vh}.wod em{font-size:2.5vh;font-style:normal}.wod small{font-size:2vh;color:var(--mut)}
.cd{font-size:2.5vh;font-weight:700;margin-bottom:.8vh}
.note{display:block;font-size:2vh;color:var(--mut);margin:.6vh 0 1vh}
.ghost{font-size:2.6vh;padding:1.1vh 1.6vw;border-radius:2vh;border:var(--bw) solid var(--ln);background:var(--cd);box-shadow:var(--ss)}
.setup{display:flex;flex-direction:column;gap:.8vh;overflow:auto}
.lab{font-size:2.2vh;font-weight:700;color:var(--mut);margin-top:.5vh}
.pills{display:flex;gap:.6vw;flex-wrap:wrap}
.pill{font-size:2.4vh;padding:.9vh 1.1vw;border-radius:5vh;border:var(--bw) solid var(--ln);background:var(--cd)}
.pill.n{min-width:6vh;text-align:center;padding:1vh .8vw}
.pill.on,.tile.on{background:var(--sel);color:var(--selt)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:1vh .8vw}
.tiles.t2{grid-template-columns:repeat(2,1fr)}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;font-size:2.3vh;font-weight:700;padding:.9vh .8vw;border-radius:2.2vh;background:var(--cd);border:var(--bw) solid var(--ln);box-shadow:var(--ss)}
.tile small{display:block;font-size:1.9vh;font-weight:400;opacity:.75}
.tile.t{flex-direction:row;align-items:center;gap:.8vw}.tile.t i{font-style:normal;font-size:3.6vh}
.setup .go{position:sticky;bottom:0}
.go{margin-top:1vh;font-size:3.6vh;font-weight:700;padding:1.3vh 3vw;border-radius:3vh;background:var(--go);color:var(--got);border:var(--bw) solid var(--ln);box-shadow:var(--sh)}
.go:active{transform:translate(.5vh,.5vh);box-shadow:none}
.go:disabled{background:#eee;color:#888;border-color:#bbb;box-shadow:none;opacity:1}
.stage{display:flex;flex-direction:column;height:100%;gap:2vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:1.4vw}
.badge{font-size:3vh;font-weight:700;padding:.9vh 1.4vw;border-radius:5vh;background:var(--cd);border:var(--bw) solid var(--ln);white-space:nowrap}
.top .ghost{font-size:2.4vh;padding:.9vh 1.2vw;white-space:nowrap}
.bar{flex:1;height:2.4vh;border-radius:2vh;background:var(--cd);border:var(--bw) solid var(--ln);overflow:hidden}
.bar i{display:block;height:100%;background:var(--o);transition:width .4s}
.qc{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:22vh}
.pre{font-size:2.8vh;color:var(--mut)}
.q{font-size:7vh;font-weight:700;margin-top:1vh;line-height:1.15}.q.sm{font-size:4.4vh}
.q.rd{font-size:3.5vh;font-weight:400;line-height:1.35;max-width:92%}.rq{font-weight:700;margin-top:1.2vh}
.emo{font-size:13vh;line-height:1}.du .emo{font-size:8vh}.du .q{font-size:5vh}.du .q.sm{font-size:3.6vh}.du .q.rd{font-size:2.8vh}
.clue{font-size:3.4vh;margin-top:.6vh}
.opts{display:grid;gap:2vh 1.6vw;flex:1}
.opt{display:flex;align-items:center;gap:1.4vw;text-align:left;font-size:3.6vh;font-weight:700;border-radius:3vh;background:var(--cd);border:var(--bw) solid var(--ln);box-shadow:var(--ss);padding:1.4vh 2vw;transition:.12s}
.opt.e{font-size:12vh;justify-content:center;padding:.6vh 1vw}.pl .opt.e{font-size:6vh}
.opt i{font-style:normal;flex:none;width:6vh;height:6vh;border-radius:50%;background:var(--ink);color:var(--cd);display:grid;place-items:center;font-size:3vh}
.opt:active{transform:scale(.98)}
.opt.ok{background:#22c55e;color:#fff}.opt.ok i{background:#fff;color:#15803d}
.opt.bad{background:#ececec;color:#8a8a8a;border-color:#8a8a8a;box-shadow:none;animation:sk .35s}.opt.bad i{background:#bdbdbd}
@keyframes sk{25%{transform:translateX(-.6vw)}75%{transform:translateX(.6vw)}}
@keyframes pu{50%{transform:scale(1.1)}}
.fb{min-height:9vh;font-size:3vh;border-radius:2vh;padding:1.4vh 2vw;visibility:hidden;border:var(--bw) solid var(--ln);color:#111}
.fb.show{visibility:visible}.fb.g{background:#dcfce7}.fb.r{background:#eef0ff}
.bz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;flex:1}
.slots{display:flex;gap:.8vw;justify-content:center}
.slot{width:8.5vh;height:10vh;display:grid;place-items:center;font-size:7vh;font-weight:700;border-bottom:.7vh solid currentColor}
.lts{display:flex;flex-wrap:wrap;gap:1.4vh 1vw;justify-content:center}
.lt{width:11vh;height:11vh;font-size:6.5vh;font-weight:700;border:var(--bw) solid var(--ln);border-radius:2.4vh;background:var(--cd);box-shadow:var(--ss)}
.lt.u{visibility:hidden}.lt.no{animation:sk .35s;background:#ececec;color:#111}.lt.hint{background:#fff1a8;color:#111;animation:pu .9s infinite}
.pn{display:grid;gap:1.4vw;flex:1;min-height:0}
.pl{border-radius:3vh;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:1.2vh;border:var(--bw) solid var(--ln);box-shadow:var(--ss);min-height:0;color:#111}
.pl .opt{flex:1;font-size:2.8vh;padding:.8vh 1vw;background:#fff;color:#111}.pl .opt i{width:4.6vh;height:4.6vh;font-size:2.4vh;background:#111;color:#fff}
.pl .opt.ok{background:#22c55e;color:#fff}.pl .opt.bad{background:#ececec;color:#8a8a8a}
.pl .bz{gap:1.2vh}.pl .slot{width:5vh;height:6vh;font-size:4.2vh;border-bottom-width:.5vh}.pl .lts{gap:1vh .6vw}.pl .lt{width:7vh;height:7vh;font-size:4.2vh;border-radius:1.6vh;background:#fff;color:#111}
.pt{display:flex;justify-content:space-between;gap:1vw;font-size:3vh;font-weight:700}
.big{font-size:7vh;font-weight:700;margin:0}
.br{display:grid;grid-template-columns:3.4vw 19vw 1fr 9vw;gap:1vw;align-items:center;font-size:2.8vh;margin:.9vh 0}
.br small{font-weight:400;color:var(--mut);font-size:2.1vh}.br .n{color:var(--mut);text-align:right}.br .v{text-align:right;white-space:nowrap}
.tr{height:2.8vh;border-radius:2vh;background:rgba(127,127,127,.15);border:.25vh solid var(--ln);overflow:hidden}.tr i{display:block;height:100%;background:var(--ink)}
.br:first-child .tr i{background:var(--o)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9}.md .card{text-align:center;padding:4vh 4vw;max-width:70vw}
/* Цифрова панель для пароля класу — навмисно маленька, щоб ніхто не піддивився */
.kp{background:rgba(0,0,0,.25)}.kp .card{padding:1.4vh 1.2vw;border-radius:2vh}
.kt{margin:0;font-size:2.2vh;font-weight:700}.kt span{font-size:2.6vh;padding:0 .3vw}
.dots{display:flex;gap:.8vh;justify-content:center;margin:1.2vh 0 .4vh}.dots i{width:1.6vh;height:1.6vh;border-radius:50%;border:.25vh solid #8f8cd6;display:block}.dots i.f{background:var(--o);border-color:var(--o)}
.perr{min-height:2vh;font-size:1.6vh;color:#b42318}
.kp .card{touch-action:none;cursor:grab;max-width:30vh}.kgrip{width:6vh;height:.7vh;border-radius:1vh;background:#cfcdee;margin:0 auto 1vh}
.kp .card.wait .keys{opacity:.35}.kp .perr{max-width:24vh;margin:0 auto}
.khint{margin:1vh auto 0;max-width:26vh;font-size:1.7vh;line-height:1.3;color:#6b6890}.khint b{color:#2b2840}
.keys{display:grid;grid-template-columns:repeat(3,6.4vh);gap:.8vh;justify-content:center;margin-top:.6vh}
.key{height:6vh;font-size:2.8vh;font-weight:700;border-radius:1.4vh;background:#fff;color:#2b2840;box-shadow:0 .4vh 0 #cfcdee;border:.25vh solid #cfcdee}
.key:active{transform:translateY(.3vh);box-shadow:0 .1vh 0 #cfcdee}.key.k2{font-size:2.4vh;background:#f7e6e1}
/* «Кнопки нижче»: усе, що натискають, — у нижній частині екрана */
.gorow{position:sticky;bottom:0;display:flex;gap:.8vw;align-items:stretch;margin-top:1vh}.gorow .go{flex:1;margin-top:0}
/* Кнопка «Кнопки нижче» — завжди в самому низу екрана, лише для молодших (див. lowOK) */
#lowb{position:fixed;left:1.4vw;bottom:1.2vh;z-index:8;font-size:2.4vh;font-weight:700;padding:1vh 1.4vw;border-radius:2vh;background:#fff1a8;color:#2b2840;white-space:nowrap;box-shadow:0 .4vh 1vh rgba(60,50,150,.18);display:none}
body.lowv #lowb{display:block}
/* Повноекранний режим: маленька кнопка у верхньому правому куті */
#fsb{position:fixed;top:.4vh;right:.6vw;z-index:8;font-size:1.6vh;font-weight:700;padding:.3vh .8vw;border-radius:1.2vh;background:rgba(255,255,255,.85);color:#6b6890;box-shadow:0 .2vh .6vh rgba(60,50,150,.15)}body.lowv #app{padding-bottom:7.5vh}
.ready{font-size:4.2vh;padding:1.6vh 4vw;margin-top:2vh}
.ses{width:min(92vw,150vh)}.sest{overflow:auto;max-height:66vh}.sest table{width:100%;border-collapse:collapse;font-size:2vh;color:var(--ink)}
.sest th{text-align:left;color:var(--mut);position:sticky;top:0;background:#fff}.sest td,.sest th{padding:.7vh .6vw;border-bottom:.2vh solid #e4e3fa;vertical-align:top}
.sest small{color:var(--mut)}.sest h3{font-size:2.4vh;margin:2.2vh 0 .6vh;color:var(--ink)}.sest h3 small{font-size:1.7vh;font-weight:400}
.stt .sest{max-height:72vh}.stt select{font:inherit;font-size:2.2vh;padding:.4vh .6vw;border-radius:1vh;border:.25vh solid #cfcdee}
.stk{display:grid;grid-template-columns:repeat(4,1fr);gap:1vh .8vw}.stk div{background:#f6f5fe;border-radius:1.6vh;padding:1vh 1vw}.stk small{display:block;font-size:1.7vh}.stk b{font-size:3vh;color:var(--ink)}
.sbar{display:inline-block;height:1.6vh;background:#f15e38;border-radius:1vh;vertical-align:middle}.sest .ghost{font-size:1.8vh;padding:.5vh .8vw}.sest .sx{opacity:.5}
.low .home{align-items:end}.low .setup{max-height:64vh}.low .hero{justify-content:flex-start}
.low .stage .qc{order:1}.low .stage .fb{order:2;margin-top:auto}.low .stage .opts,.low .stage .bz,.low .stage .pn{order:3;flex:none;height:46vh}.low .stage .top{order:4}
.low .stage[style]{justify-content:flex-end!important}.low .md{place-items:end center;padding-bottom:3vh}
.intro{text-align:left;font-size:2.8vh;margin-top:1vh}.intro p{margin:.8vh 0}
/* Режим учителя */
.admbar{position:fixed;top:0;left:50%;transform:translateX(-50%);background:#2b2840;color:#fff;font-size:2vh;padding:.6vh 1vw;border-radius:0 0 1.4vh 1.4vh;display:flex;gap:.8vw;align-items:center;z-index:5}.admbar .ghost{font-size:1.8vh;padding:.4vh .8vw;color:#2b2840}
.edf{text-align:left!important;width:min(80vw,120vh);max-width:none!important;display:flex;flex-direction:column;gap:1vh}
.edf label{display:flex;flex-direction:column;gap:.4vh;font-size:2vh;color:var(--mut)}
.eo{display:flex;align-items:center;gap:.8vw}.eo input[type=radio]{width:3.4vh;height:3.4vh;flex:none}.eo .eot{flex:1}.edf{max-height:92vh;overflow:auto}
.snd{align-self:center;font-size:3vh;font-weight:700;padding:1.2vh 2.4vw;border-radius:2.4vh;background:#fff1a8;color:#2b2840;box-shadow:var(--ss)}.cr{font-size:1.5vh;opacity:.55;align-self:center}
.slot{cursor:pointer}.nwb{background:#ffe066;color:#2b2840;border-radius:1vh;padding:0 .5vw;font-weight:700}
.edf input,.edf textarea{font:inherit;font-size:2.4vh;padding:.8vh 1vw;border:.25vh solid #cfcdee;border-radius:1.2vh;color:#111;-webkit-user-select:text;user-select:text}
.shake{animation:sk .35s}
/* Анімації натискань: кнопка «вдавлюється», з пальця розходяться кільце й конфетті, щойно обрана кнопка «желейно» підстрибує */
button{transition:scale .12s}button:not(:disabled):active{scale:.94}
.pop{animation:jelly .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes jelly{0%{scale:1}25%{scale:1.13 .9}45%{scale:.94 1.07}65%{scale:1.04 .97}100%{scale:1}}
.fxr,.fxd{position:fixed;pointer-events:none;z-index:20;border-radius:50%}
.fxr{width:2vh;height:2vh;margin:-1vh 0 0 -1vh;border:.5vh solid #f15e38;animation:ring .55s ease-out forwards}
.fxd{width:1.4vh;height:1.4vh;margin:-.7vh 0 0 -.7vh;animation:burst .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes ring{to{scale:7;opacity:0}}
@keyframes burst{60%{opacity:1}to{translate:var(--dx) var(--dy);scale:.3;opacity:0}}
@media(prefers-reduced-motion:reduce){.pop,.fxr,.fxd{animation:none!important}.fxr,.fxd{display:none}}
img.em{width:1.15em;height:1.15em;vertical-align:-.22em;display:inline-block;object-fit:contain;pointer-events:none}
/* ---- Тема «Бульбашки школи» (v1) */
.v1{--pa:#ecebfb;--dot:transparent;--ln:#d9d7f3;--bw:.3vh;--sh:0 1vh 3vh rgba(60,50,150,.12);--ss:0 .5vh 1.4vh rgba(60,50,150,.1);--sel:#1c1c3a;--lg:#f15e38;--lgt:#fff;--go:#f15e38;--got:#fff}
.v1 .card{border-radius:3.6vh 3.6vh 3.6vh .6vh}.v1 .tile,.v1 .opt{border-radius:2.4vh 2.4vh 2.4vh .5vh}
.v1 .go{border:0}
/* ---- «Скрапбук» (v8): менше чорного, обране — пастельне з обвідкою */
.v8{--pa:#efecfb;--ln:transparent;--sh:0 .8vh 2vh rgba(60,50,150,.16);--ink:#2b2840;--sel:#ffd9cc;--selt:#2b2840;--ring:#f15e38}
.v8 .card{position:relative;border-radius:1vh}
.v8 .logo{border-radius:0;transform:rotate(-3deg);clip-path:polygon(0 4%,6% 0,15% 5%,25% 0,38% 4%,50% 0,63% 5%,75% 0,88% 4%,100% 0,98% 50%,100% 100%,85% 96%,70% 100%,55% 95%,40% 100%,25% 96%,10% 100%,0 96%,2% 50%)}
.v8 .tile{border-radius:.8vh;box-shadow:0 .4vh 1vh rgba(60,50,150,.12)}.v8 .tile:nth-child(odd){transform:rotate(-1.2deg)}.v8 .tile:nth-child(even){transform:rotate(1deg)}
.v8 .tile.on,.v8 .pill.on{box-shadow:inset 0 0 0 .45vh var(--ring),0 .4vh 1vh rgba(60,50,150,.12);font-weight:700}
.v8 .opt i{background:#e4e3fa;color:#3a3878}.v8 .pl .opt i{background:#e4e3fa;color:#3a3878}
.v8 .tr i{background:#9d9ad8}.v8 .br:first-child .tr i{background:#f15e38}.v8 .tr{border-color:#cfcdee}
/* ---- «Вирізки» (v14): фестонні краї карток, паперові кола на тлі, обране — персикове */

// ===================== ПРИСТРОЇ: АКТИВНІСТЬ І ЕКРАНИ =====================

const VER=String(cyrb(document.scripts[0].text,3)).slice(0,6);let SNL='',MON=0,MSA=0,MDV={};
function devInfo(){const g=app.dataset.s!='h',m=S.mode,solo=m=='1',ks=!g?[]:solo&&K!=null?[K]:m=='c'?S.cs.slice():[];
return{s:ADM?'adm':$('kp')?'kp':g?'g':SCR,m,g:g?S.game:'',ks,np:g&&!solo&&m!='c'?+m:0,q:g&&Q?Math.min(i+1,Q.length):0,n:g&&Q?Q.length:0,
sc:g?(solo?sc:SC&&SC.slice()):0,idle:Date.now()-last,w:innerWidth,h:innerHeight,ua:navigator.userAgent.slice(0,160),v:VER,qn:qGet().length,net:NET,fs:!!fsEl(),bc:document.body.className}}
function devSnap(){if(ADM)return'';let h='';for(const e of document.body.children)if(e.tagName!='SCRIPT')h+=e.outerHTML;return h.length>350000?'':h}
function beat(){if(document.hidden&&!MON)return;let sn=null;try{const h=devSnap();if(h!=SNL){SNL=h;sn=h}}catch(x){}
rpc('mova_beat',{dev:DEV,info:devInfo(),snap:sn}).catch(()=>{if(sn!==null)SNL=''})}
setTimeout(beat,1500);setInterval(beat,5000);
const ago=ms=>{const s=Math.max(0,ms/1000|0);return s<60?s+' с':s<3600?(s/60|0)+' хв':(s/3600|0)+' год '+p2((s%3600)/60|0)+' хв'};
const uaN=u=>/Windows/.test(u)?'Windows':/Android/.test(u)?'Android':/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Mac/.test(u)?'Mac':/CrOS/.test(u)?'Chromebook':/Linux/.test(u)?'Linux':'Пристрій';
function devState(d,now){const o=d.info||{};
if(now-d.seen>20000)return['off','⚪ Не на зв\'язку · '+ago(now-d.seen)+' тому'];
if(o.s=='adm')return['adm','🛠 Режим учителя'];if(o.s=='kp')return['kp','🔑 Вводять пароль класу'];
if(o.s=='g'){const who=o.ks&&o.ks.length?o.ks.map(k=>CL[k]?'«'+CL[k][1]+'» '+CL[k][0]+' кл.':'?').join(' ⚔️ '):o.np?o.np+' гравці':'гра';
return['play',`🟢 Грають: ${who} · ${P[o.g]?P[o.g].i+' '+P[o.g].n:o.g||''}${o.n?` · завдання ${o.q} з ${o.n}`:''}${o.sc?` · очки: ${Array.isArray(o.sc)?o.sc.join(' : '):o.sc}`:''}`]}
return['idle',(o.idle<60000?'🟡 ':'🔵 ')+(o.s=='c'?'Таблиця класів':'Головна сторінка')+' · востаннє торкалися '+ago(o.idle)+' тому']}
function mon(){if(!ADM)return;const old=$('ed');if(old)old.remove();const m=document.createElement('div');m.id='ed';m.className='md';
m.innerHTML=`<div class="card edf mon"><div style="display:flex;align-items:center;gap:2vh;flex-wrap:wrap"><p class=big style="font-size:3.4vh;margin:0">🖥 Пристрої з грою</p><span class=sub id=mons style="font-size:1.9vh"></span><span style="flex:1"></span><button class=go onclick="monX()">Закрити</button></div>
<p class=sub style="font-size:1.8vh;margin:0">Оновлюється кожні 5 с. Знімок показує, як зараз виглядає екран пристрою. Назву пристрою можна змінити — ✏️.</p><div id=mong class=mong></div></div>`;
document.body.appendChild(m);MON=1;MSA=0;MDV={};monPull();clearInterval(mon.t);mon.t=setInterval(()=>{if(!$('mong'))return monX();monPull()},5000)}
function monX(){clearInterval(mon.t);MON=0;const m=$('ed');if(m)m.remove();home()}
function monPull(){rpc('mova_devs',{since:MSA}).then(r=>{if(!$('mong'))return;for(const d of r.d){const o=MDV[d.dev]||{};if(d.snap!=null){o.snap=d.snap;o.sa=d.sa}Object.assign(o,{dev:d.dev,name:d.name,info:d.info,seen:d.seen});MDV[d.dev]=o;if(d.sa>MSA)MSA=d.sa}monDraw(r.now)},()=>{const e=$('mons');if(e)e.textContent='Немає зв\'язку з базою'})}
function monDraw(now){const g=$('mong');if(!g)return;const off=d=>now-d.seen>20000,l=Object.values(MDV).sort((a,b)=>off(a)-off(b)||(a.name||'~').localeCompare(b.name||'~')||b.seen-a.seen);
const on=l.filter(d=>!off(d)),pl=on.filter(d=>d.info&&d.info.s=='g');$('mons').textContent=`На зв'язку: ${on.length} з ${l.length} · грають зараз: ${pl.length}`;
const head=[...document.head.children].filter(e=>e.tagName!='SCRIPT').map(e=>e.outerHTML).join('');
l.forEach((d,n)=>{let c=g.querySelector(`[data-dev="${d.dev}"]`);if(!c){c=document.createElement('div');c.dataset.dev=d.dev;c.innerHTML=`<div class=mdh><b class=mdn></b><button class=ghost title="Назва" onclick="monName('${d.dev}')">✏️</button></div><div class=mds></div><div class=mdf><iframe sandbox tabindex=-1></iframe></div><small class=mdi></small>`}
if(g.children[n]!==c)g.insertBefore(c,g.children[n]||null);
const o=d.info||{},[st,tx]=devState(d,now),f=c.querySelector('iframe'),w=o.w||1280,h=o.h||720,W=c.querySelector('.mdf').clientWidth||300;
c.className='mdev '+st;c.querySelector('.mdn').textContent=(d.name||uaN(o.ua||''))+(d.dev==DEV?' (цей пристрій)':'');c.querySelector('.mds').textContent=tx;
c.querySelector('.mdi').textContent=`№ ${d.dev.slice(-4)} · ${o.w||'?'}×${o.h||'?'}${o.fs?' · на весь екран':''}${o.v&&o.v!=VER?' · ⚠️ стара версія гри':''}${o.qn?` · ще не відправлено: ${o.qn}`:''}${o.net===0?' · ⚠️ немає зв\'язку з базою':''}`;
const sc=W/w;f.style.cssText=`width:${w}px;height:${h}px;transform:scale(${sc});transform-origin:0 0`;c.querySelector('.mdf').style.height=h*sc+'px';
const key=String(d.sa||0)+(o.s=='adm'?'a':'');if(f.dataset.k!==key){f.dataset.k=key;
f.srcdoc=d.snap&&o.s!='adm'?`<!doctype html><html><head><meta charset=utf-8>${head}<style>*{cursor:default!important}html,body{overflow:hidden}</style></head><body class="${o.bc||''}" style="pointer-events:none">${d.snap}</body></html>`
:`<p style="font:6vh sans-serif;padding:6vh;color:#777">${o.s=='adm'?'У режимі вчителя екран не показується':'Знімка екрана поки немає'}</p>`}})}
function monName(dev){const d=MDV[dev];const n=prompt('Назва пристрою (наприклад, «Хол, 1 поверх» або «5 клас, ноутбук»):',d&&d.name||'');if(n==null)return;rpc('mova_dev_name',{dev,name:n}).then(()=>{if(d)d.name=n.trim();monPull()},()=>alert('Немає зв\'язку з базою'))}
// ===================== ПОВНИЙ ЕКРАН =====================
// Браузер дозволяє повний екран лише після дотику, тож вмикаємо його на першому дотику до гри.
// Після «Вийти з повноекранного режиму» сам не вмикаємо, доки гра через бездіяльність не повернеться на головну.
let FSOFF=0;const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function fsOn(){const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;if(!f||fsEl())return;try{const p=f.call(d);if(p&&p.catch)p.catch(()=>{})}catch(x){}}
function fsUp(){$('fsb').textContent=fsEl()?'✕ Вийти з повноекранного режиму':'⛶ На весь екран'}
function fsT(){if(fsEl()){FSOFF=1;(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{FSOFF=0;fsOn()}}
document.addEventListener('pointerdown',e=>{if(!FSOFF&&!e.target.closest('#fsb'))fsOn()},true);
['fullscreenchange','webkitfullscreenchange'].forEach(t=>document.addEventListener(t,fsUp));fsUp();
