<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Екран переможців</title>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Caveat:wght@700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--o:#f15e38;--od:#c9441d;--ot:#fff1ec;--ink:#111;--y:#ffc93c;--pa:#fffaf6}
*{box-sizing:border-box}body{margin:0;background:#eee6df;font-family:"Balsamiq Sans",system-ui,sans-serif;color:var(--ink)}
.wrap{max-width:1640px;margin:0 auto;padding:16px}
h1.pg{font-size:28px;margin:10px 0 4px}p.pg{margin:0 0 18px;font-size:16px}
.var{margin:0 0 36px}.var h2{font-size:22px;margin:0 0 4px}.var p{margin:0 0 10px;font-size:15px;max-width:1100px}
.box{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border:3px solid #111;border-radius:18px;box-shadow:6px 6px 0 #111}
.scr{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--pa)}
.scr *{position:absolute}.scr svg *{position:static}.scr .st,.scr small,.scr br{position:static}
.dots{inset:0;background-image:radial-gradient(rgba(17,17,17,.11) 2px,transparent 2.5px);background-size:28px 28px}
.em{border-radius:50%;background:#fff;border:5px solid #111;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transform:translate(-50%,-50%)}
.em b,.em i{position:static}.em b{line-height:.9;color:var(--o);-webkit-text-stroke:3px #111;paint-order:stroke fill;font-weight:700}
.em i{font-style:normal;border:2px dashed #111;border-radius:8px;padding:0 6px;background:var(--ot);margin-top:4px}
.conf{top:-30px;width:14px;height:22px;border:2px solid #111;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(980px) rotate(720deg)}}
.kid svg{width:100%;height:100%;overflow:visible}
.jump{animation:jump .9s ease-in-out infinite}@keyframes jump{0%,100%{transform:translateY(0)}40%,60%{transform:translateY(-30px)}}
.wl{transform-box:fill-box;transform-origin:100% 0;animation:wl 1s ease-in-out infinite}.wr{transform-box:fill-box;transform-origin:0 0;animation:wr 1s ease-in-out infinite}
@keyframes wl{50%{transform:rotate(-14deg)}}@keyframes wr{50%{transform:rotate(14deg)}}
.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-14px)}}

/* 1 rockets */
.rk .ttl{left:0;right:0;top:30px;text-align:center;font-size:92px;font-weight:700;color:var(--o);-webkit-text-stroke:5px #111;paint-order:stroke fill;text-shadow:6px 6px 0 #111;white-space:nowrap}
.rk .ttl span{position:static;display:inline-block;animation:blink .25s both}
@keyframes blink{from{opacity:0;transform:translateY(-30px) scale(.4)}}
.rk .cd{left:40px;top:40px;font-size:30px;font-weight:700;background:#111;color:#7dff8a;padding:8px 16px;border-radius:12px;font-family:monospace}
.rk .star{width:26px;height:26px;background:var(--o);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.4) rotate(45deg)}}
.rk .planet{width:190px;height:190px;border-radius:50%;background:var(--o);border:6px solid #111;box-shadow:inset -24px -18px 0 var(--od)}
.rk .ring{width:300px;height:70px;border:8px solid #111;border-radius:50%;transform:rotate(-18deg)}
.rk .rocket{animation:launch 1.8s cubic-bezier(.2,.9,.3,1.05) both}
.rk .rocket>.in{inset:0;animation:hover 1.6s ease-in-out infinite}
@keyframes launch{from{transform:translateY(900px)}}@keyframes hover{50%{transform:translateY(-16px) rotate(1.5deg)}}
.rk .flame{transform-box:fill-box;transform-origin:50% 0;animation:fl .18s ease-in-out infinite alternate}
@keyframes fl{to{transform:scaleY(1.35) scaleX(.85)}}
.rk .pad{bottom:0;height:120px;border:5px solid #111;border-bottom:0;border-radius:16px 16px 0 0;background:repeating-linear-gradient(-45deg,var(--y) 0 26px,#111 26px 52px);display:flex;align-items:center;justify-content:center}
.rk .pad div{position:static;background:#fff;border:4px solid #111;border-radius:12px;padding:4px 18px;font-size:30px;font-weight:700;text-align:center;line-height:1.1}
.rk .pad small{font-size:22px;font-weight:400}
.rk .puff{border-radius:50%;background:#fff;border:4px solid #111;animation:puff 2s ease-in-out infinite}
@keyframes puff{50%{transform:scale(1.15)}}

/* 2 cakes */
.ck{background:var(--ot)!important}
.ck .bunt{left:-20px;right:-20px;top:0;height:120px}
.ck .flag{transform-origin:50% 0;animation:sw 2s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(8deg)}}
.ck .ttl{left:0;right:0;top:120px;text-align:center;font-family:Caveat,cursive;font-size:130px;line-height:1;color:var(--o);-webkit-text-stroke:4px #111;paint-order:stroke fill;text-shadow:5px 5px 0 #111;white-space:nowrap}
.ck .ttl span{position:static;display:inline-block;animation:pp 2.4s ease-in-out infinite}
@keyframes pp{0%,100%{transform:scale(1)}10%{transform:scale(1.3) rotate(-8deg)}20%{transform:scale(1)}}
.ck .tier{border:5px solid #111;border-radius:22px;background:#fff;overflow:hidden;transform:translateX(-50%)}
.ck .tier .fr{left:0;right:0;top:0;height:46px;background:radial-gradient(circle at 50% 0,var(--o) 17px,transparent 18px) 0 18px/40px 30px repeat-x,linear-gradient(var(--o),var(--o)) 0 0/100% 22px no-repeat}
.ck .tier .sp{width:14px;height:5px;border-radius:3px}
.ck .tier .tx{left:0;right:0;bottom:12px;text-align:center;font-size:30px;font-weight:700;line-height:1.05}
.ck .tier .tx small{font-size:22px;font-weight:400}
.ck .plate{height:26px;border:5px solid #111;border-radius:50%;background:#fff;transform:translateX(-50%)}
.ck .num{font-family:Caveat,cursive;font-size:84px;line-height:1;color:#fff;-webkit-text-stroke:4px #111;paint-order:stroke fill;transform:translateX(-50%)}
.ck .cand{width:18px;height:70px;border:4px solid #111;border-radius:6px;background:repeating-linear-gradient(-45deg,#fff 0 8px,var(--o) 8px 16px)}
.ck .cand:after{content:"";position:absolute;left:-2px;top:-34px;width:14px;height:26px;background:var(--y);border:3px solid #111;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:50% 100%;animation:fl2 .3s ease-in-out infinite alternate}
@keyframes fl2{to{transform:scale(.8,1.15) rotate(6deg)}}

/* 3 trading cards */
.tc{background:#111!important}
.tc .half{inset:0;background:radial-gradient(circle,var(--o) 2.5px,transparent 3px) 0 0/22px 22px;opacity:.35;-webkit-mask:radial-gradient(circle at 50% 120%,#000 0,transparent 70%);mask:radial-gradient(circle at 50% 120%,#000 0,transparent 70%)}
.tc .burst{left:50%;top:52%;width:1800px;height:1800px;margin:-900px;background:repeating-conic-gradient(rgba(241,94,56,.28) 0 6deg,transparent 6deg 18deg);animation:spin 50s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.tc .ttl{left:0;right:0;top:22px;text-align:center;font-size:96px;font-weight:700;letter-spacing:2px;color:var(--y);-webkit-text-stroke:4px #111;paint-order:stroke fill;text-shadow:0 0 0 #111,5px 5px 0 var(--o),10px 10px 0 #fff;white-space:nowrap;animation:zoom 2.5s ease-in-out infinite}
@keyframes zoom{50%{transform:scale(1.04)}}
.tc .card{border-radius:24px;background:var(--pa);border:6px solid #111;box-shadow:0 0 0 6px var(--o),14px 14px 0 6px #000;overflow:hidden;animation:flip 1.1s cubic-bezier(.3,1.4,.5,1) both}
.tc .card .in{inset:0;animation:flt 3s ease-in-out infinite}
@keyframes flip{from{transform:perspective(900px) rotateY(100deg) scale(.5);opacity:0}}
@keyframes flt{50%{transform:translateY(-8px)}}
.tc .card .hd{left:0;right:0;top:0;height:64px;background:var(--o);border-bottom:5px solid #111;color:#fff;font-weight:700;font-size:30px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;-webkit-text-stroke:2px #111;paint-order:stroke fill}
.tc .card .hd span{position:static}
.tc .card .art{left:20px;right:20px;top:84px;bottom:150px;border:5px solid #111;border-radius:14px;background:repeating-conic-gradient(from 0deg at 50% 60%,#ffe3d8 0 10deg,#fff 10deg 20deg)}
.tc .card .nm{left:0;right:0;bottom:92px;text-align:center;font-size:40px;font-weight:700}
.tc .card .stat{left:20px;right:20px;bottom:22px;height:60px;border:4px solid #111;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:space-around;font-size:26px;font-weight:700}
.tc .card .stat span{position:static}
.tc .card:after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.85) 48%,rgba(255,201,60,.5) 52%,transparent 58%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-70%)}60%,100%{transform:translateX(70%)}}
.tc .base{height:60px;border:5px solid #111;border-bottom:0;background:var(--o);border-radius:12px 12px 0 0;bottom:0;color:#fff;font-size:40px;font-weight:700;text-align:center;line-height:52px;-webkit-text-stroke:3px #111;paint-order:stroke fill}

/* 4 books */
.bk{background:linear-gradient(90deg,transparent 118px,#f6a58e 118px 122px,transparent 122px),repeating-linear-gradient(#fffdf8 0 40px,#cfe0ef 40px 42px)!important}
.bk .board{left:290px;top:26px;width:1020px;height:170px;background:#1f2a24;border:14px solid #b5651d;border-radius:18px;box-shadow:8px 8px 0 #111;outline:4px solid #111}
.bk .board .w{left:0;right:0;top:12px;text-align:center;font-family:Caveat,cursive;font-size:118px;line-height:1;color:#f7f3e8;text-shadow:0 0 6px rgba(255,255,255,.5);white-space:nowrap;animation:write 6s steps(40) infinite}
@keyframes write{0%{clip-path:inset(0 100% 0 0)}40%,97%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
.bk .board .chalk{right:40px;bottom:-10px;width:70px;height:16px;background:#fff;border:3px solid #111;border-radius:4px}
.bk .book{height:58px;border:5px solid #111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;letter-spacing:1px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.bk .book:before,.bk .book:after{content:"";position:absolute;top:8px;bottom:8px;width:10px;border-left:4px solid rgba(17,17,17,.5);border-right:4px solid rgba(17,17,17,.5)}
.bk .book:before{left:22px}.bk .book:after{right:22px}
.bk .book span{position:static}
.bk .tag{transform:translateX(-50%);background:var(--y);border:5px solid #111;border-radius:14px;box-shadow:6px 6px 0 #111;padding:4px 18px;font-size:32px;font-weight:700;white-space:nowrap;text-align:center;line-height:1.1}
.bk .tag small{font-size:22px;font-weight:400}
.bk .plane{animation:plane 7s linear infinite}
@keyframes plane{0%{transform:translate(-200px,120px) rotate(-8deg)}50%{transform:translate(900px,-20px) rotate(4deg)}100%{transform:translate(1900px,90px) rotate(-6deg)}}

/* 5 polaroids */
.pl{background:radial-gradient(circle,rgba(120,70,20,.25) 2px,transparent 2.5px) 0 0/18px 18px,radial-gradient(circle,rgba(255,255,255,.18) 1.5px,transparent 2px) 9px 9px/18px 18px,#dba86e!important}
.pl .frame{inset:0;border:22px solid #8a5a2b;box-shadow:inset 0 0 0 5px #111}
.pl .bulb{width:22px;height:30px;border:3px solid #111;border-radius:50% 50% 45% 45%;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{filter:brightness(.55)}}
.pl .let{display:inline-block;position:static;padding:2px 12px;margin:0 3px;border:4px solid #111;font-weight:700;box-shadow:4px 4px 0 #111}
.pl .ttl{left:0;right:0;top:64px;text-align:center;font-size:66px;white-space:nowrap}
.pl .pol{background:#fff;border:4px solid #111;box-shadow:10px 12px 0 rgba(0,0,0,.35);padding:18px 18px 0;transform-origin:50% 0;animation:swing 3s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) * -0.4))}}
.pl .pol .ph{position:relative;width:100%;border:4px solid #111;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 100%,#ffc2b0 0 9deg,#ffe6dc 9deg 18deg)}
.pl .pol .cap{position:static;display:block;text-align:center;font-family:Caveat,cursive;font-size:40px;line-height:1.4;white-space:nowrap}
.pl .pin{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8f75,var(--o) 50%,var(--od));border:4px solid #111;left:50%;top:-20px;margin-left:-17px}
.pl .stk{width:110px;height:110px;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:700;color:#fff;-webkit-text-stroke:3px #111;paint-order:stroke fill;isolation:isolate;}.pl .stk:before{content:'';position:absolute;inset:0;z-index:-1;background:var(--y);clip-path:polygon(50% 0,61% 32%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 32%);animation:spin 8s linear infinite}
.pl .flash{inset:0;background:#fff;opacity:0;animation:flash 4s infinite;pointer-events:none}
@keyframes flash{0%,88%,100%{opacity:0}90%{opacity:.85}}

/* 6 theatre */
.th{background:#151010!important}
.th .wall{inset:0;background:radial-gradient(ellipse at 50% 30%,#3a2018,#151010 70%)}
.th .floor{left:0;right:0;bottom:0;height:170px;background:repeating-linear-gradient(90deg,#b5651d 0 130px,#9b521a 130px 134px);border-top:6px solid #111}
.th .spot{top:-40px;width:520px;height:1000px;background:linear-gradient(rgba(255,240,200,.55),rgba(255,240,200,.08));clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen}
.th .s1{left:0;animation:sp1 4s ease-in-out infinite}.th .s2{right:0;animation:sp2 4s ease-in-out infinite}
@keyframes sp1{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(-14deg)}}@keyframes sp2{0%,100%{transform:rotate(38deg)}50%{transform:rotate(14deg)}}
.th .cur{top:0;bottom:0;width:820px;background:repeating-linear-gradient(90deg,var(--o) 0 50px,var(--od) 50px 70px,var(--o) 70px 110px);border:6px solid #111;z-index:20}
.th .cl{left:0;animation:cl 2.2s .3s cubic-bezier(.6,0,.3,1) both;border-radius:0 0 60px 0}.th .cr{right:0;animation:cr 2.2s .3s cubic-bezier(.6,0,.3,1) both;border-radius:0 0 0 60px}
@keyframes cl{from{transform:translateX(0)}to{transform:translateX(-680px)}}@keyframes cr{from{transform:translateX(0)}to{transform:translateX(680px)}}
.th .val{left:0;right:0;top:0;height:70px;z-index:21;background:radial-gradient(circle at 50% 100%,transparent 0 30px,var(--od) 31px) 0 0/100px 70px repeat-x;border-top:8px solid #111}
.th .mq{left:50%;top:84px;transform:translateX(-50%);z-index:15;background:var(--o);border:6px solid #111;border-radius:26px;padding:22px 60px 26px;font-size:80px;font-weight:700;color:#fff;-webkit-text-stroke:4px #111;paint-order:stroke fill;white-space:nowrap;box-shadow:0 0 60px rgba(255,201,60,.5)}
.th .mq:before{content:"";position:absolute;inset:6px;border-radius:20px;background:radial-gradient(circle,var(--y) 6px,transparent 7px) 0 0/30px 30px;-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude;padding:10px;animation:mqb .6s steps(1) infinite}
@keyframes mqb{50%{background-position:15px 0}}
.th .stp{bottom:120px;border:5px solid #111;border-radius:12px 12px 0 0;background:#2a2a2a;color:#fff;text-align:center;font-weight:700;box-shadow:inset 0 10px 0 var(--o)}
.th .stp .n{position:static;display:block;font-size:72px;line-height:1.1;color:var(--y);-webkit-text-stroke:3px #111;paint-order:stroke fill;margin-top:10px}
.th .stp .t{position:static;display:block;font-size:28px}
.th .flw{top:-60px;font-size:46px;animation:fall linear infinite}
</style></head><body><div class="wrap">
<h1 class="pg">Екран переможців: 6 різних ідей</h1>
<p class="pg">1–3 з емблемами класів, 4–6 з учнями у шкільній формі. Приклад: 1 — Ентузіасти, 2 — Агенти, 3 — Оптимісти. Білі кола з літерою — місця для справжніх емблем.</p>
<div id="list"></div></div>
<script>
// cartoon kid in school uniform
function kid({shirt='#e52a2a',skin='#f6c7a3',hair='#7a4a26',style='short',pose='up',glasses=0,mouth='o'}){
 const sk='stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
 const arm=(side)=>{const L=side<0;let p;
  if(pose=='up')p=L?'M34 88 L14 46':'M86 88 L106 46';
  else if(pose=='peace')p=L?'M34 88 L18 120':'M86 88 L104 52';
  else if(pose=='hold')p=L?'M34 88 L30 50':'M86 88 L90 50';
  else p=L?'M34 88 L22 128':'M86 88 L98 128';
  const end=p.split(' ').slice(-2).map(Number);
  let hand=`<circle cx="${end[0]}" cy="${end[1]}" r="8" fill="${skin}" ${sk}/>`;
  if(pose=='peace'&&!L)hand+=`<path d="M${end[0]-3} ${end[1]-6} l-6 -16 M${end[0]+3} ${end[1]-6} l4 -17" ${sk} fill="none"/>`;
  return `<g class="arm ${pose!='down'&&pose!='hold'?(L?'wl':'wr'):''}"><path d="${p}" stroke="#111" stroke-width="20" stroke-linecap="round" fill="none"/><path d="${p}" stroke="${shirt}" stroke-width="12" stroke-linecap="round" fill="none"/>${hand}</g>`};
 const hairs={short:`<path d="M30 40 Q28 8 60 8 Q92 8 90 40 Q80 22 60 24 Q42 22 30 40Z" fill="${hair}" ${sk}/>`,
  pony:`<path d="M28 44 Q26 6 60 8 Q94 6 92 44 Q84 20 60 22 Q38 20 28 44Z" fill="${hair}" ${sk}/><path d="M90 26 Q112 30 104 62 Q98 44 90 40Z" fill="${hair}" ${sk}/>`,
  bob:`<path d="M26 58 Q20 6 60 8 Q100 6 94 58 L86 58 Q86 26 60 24 Q34 26 34 58Z" fill="${hair}" ${sk}/>`,
  curly:`<g fill="${hair}" ${sk}><circle cx="36" cy="26" r="12"/><circle cx="52" cy="16" r="13"/><circle cx="70" cy="16" r="13"/><circle cx="86" cy="28" r="12"/></g>`};
 const m={o:'<path d="M48 54 Q60 70 72 54 Z" fill="#fff" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>',s:'<path d="M48 56 Q60 66 72 56" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>'}[mouth];
 return `<svg viewBox="0 0 120 190">
 <rect x="40" y="132" width="17" height="44" rx="6" fill="#222" ${sk}/><rect x="63" y="132" width="17" height="44" rx="6" fill="#222" ${sk}/>
 <ellipse cx="46" cy="178" rx="15" ry="8" fill="#fff" ${sk}/><ellipse cx="74" cy="178" rx="15" ry="8" fill="#fff" ${sk}/>
 ${arm(-1)}${arm(1)}
 <path d="M32 84 Q34 74 48 72 L72 72 Q86 74 88 84 L86 140 L34 140 Z" fill="${shirt}" ${sk}/>
 <g transform="translate(60 104)" fill="#fff"><circle r="10"/><circle cx="-11" cy="-7" r="3.5"/><circle cx="11" cy="-8" r="3"/><circle cx="12" cy="7" r="3.5"/><circle cx="-10" cy="9" r="2.6"/><circle cx="0" cy="-14" r="2.5"/></g>
 <rect x="52" y="62" width="16" height="14" fill="${skin}" ${sk}/>
 <circle cx="60" cy="40" r="30" fill="${skin}" ${sk}/>
 ${hairs[style]}
 <circle cx="49" cy="40" r="4" fill="#111"/><circle cx="71" cy="40" r="4" fill="#111"/>
 <circle cx="42" cy="51" r="5" fill="#ff8a8a" opacity=".7"/><circle cx="78" cy="51" r="5" fill="#ff8a8a" opacity=".7"/>
 ${glasses?`<g fill="none" stroke="#e52a2a" stroke-width="4"><circle cx="49" cy="40" r="9"/><circle cx="71" cy="40" r="9"/><path d="M58 40 h4"/></g>`:''}
 ${m}</svg>`}
const W=[['Ентузіасти',2840],['Агенти',2615],['Оптимісти',2390]];
const T='Вітаємо переможців!';
const C1=['#f15e38','#111','#fff','#ffc93c','#ffb199'];
const rnd=(a,b)=>a+Math.random()*(b-a);
function conf(n,cols){let s='';for(let i=0;i<n;i++)s+=`<div class="conf" style="left:${rnd(0,1600)}px;background:${cols[i%cols.length]};animation-duration:${rnd(3,7)}s;animation-delay:${-rnd(0,7)}s;border-radius:${i%3?2:50}px;width:${rnd(10,20)}px"></div>`;return s}
const em=(k,x,y,d)=>`<div class="em" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px"><b style="font-size:${d*.46}px">${W[k][0][0]}</b><i style="font-size:${Math.max(12,d*.085)}px">емблема</i></div>`;
const R='#e52a2a',B='#1d1d1d',SK=['#f6c7a3','#eab68f','#f9d3b4','#d9a27a'],HR=['#7a4a26','#f2c14e','#2a1a10','#b5651d','#4a2c17'];
function group(cx,base,n,size,seed,o={}){let s='';const g=size*0.6;for(let i=0;i<n;i++){const x=cx+(i-(n-1)/2)*g-size*0.32;const q=(seed+i)%5;
 s+=`<div class="kid ${o.jump?'jump':''}" style="left:${x}px;top:${base-size}px;width:${size*0.64}px;height:${size}px;animation-delay:${(i*.17+seed*.1)%0.9}s;z-index:${4+(i%2)}">${kid({shirt:(i+seed)%2?B:R,skin:SK[q%4],hair:HR[q],style:['short','pony','bob','curly','pony'][q],pose:o.pose?o.pose(i):'up',glasses:o.gl&&i==1,mouth:i%2?'o':'s'})}</div>`}return s}

// 1. Ракети
function rocket(k,cx,bottom,w,delay){const h=w*1.9;return `<div class="rocket" style="left:${cx-w/2}px;top:${bottom-h}px;width:${w}px;height:${h}px;animation-delay:${delay}s"><div class="in">
<svg viewBox="0 0 160 304" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
<path class="flame" d="M56 250 Q80 340 104 250Z" fill="#ffc93c" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
<path class="flame" d="M66 250 Q80 300 94 250Z" fill="#f15e38" style="animation-delay:.09s"/>
<path d="M40 170 L6 246 L46 232Z M120 170 L154 246 L114 232Z" fill="#f15e38" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
<path d="M80 6 C132 60 132 180 120 236 L40 236 C28 180 28 60 80 6Z" fill="#fff" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
<path d="M80 6 C104 30 116 56 121 78 L39 78 C44 56 56 30 80 6Z" fill="#f15e38" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
<rect x="56" y="236" width="48" height="16" rx="4" fill="#111"/>
<circle cx="80" cy="150" r="50" fill="#111"/></svg>
${em(k,w/2,h*150/304,w*.56)}</div></div>`}
function v1(){let st='';for(let i=0;i<26;i++)st+=`<div class="star" style="left:${rnd(20,1580)}px;top:${rnd(150,620)}px;animation-delay:${-rnd(0,2)}s;transform:scale(${rnd(.5,1.2)})"></div>`;
 let p='';[[300,'#fff'],[120,'#fff'],[480,'#fff'],[1150,'#fff'],[1320,'#fff'],[1480,'#fff'],[640,'#fff'],[960,'#fff']].forEach(([x],i)=>p+=`<div class="puff" style="left:${x}px;top:${730+(i%3)*20}px;width:${rnd(110,170)}px;height:${rnd(80,110)}px;animation-delay:${-i*.3}s;z-index:1"></div>`);
 return `<div class="dots"></div>${st}<div class="planet" style="left:1320px;top:150px"></div><div class="ring" style="left:1265px;top:205px"></div>
 <div class="cd">Т–0 · старт! 🚀</div>
 <div class="ttl">${[...T].map((c,i)=>c==' '?'&nbsp;':`<span style="animation-delay:${.4+i*.07}s">${c}</span>`).join('')}</div>
 ${p}
 ${rocket(1,380,640,190,1.2)}${rocket(0,800,610,225,1.9)}${rocket(2,1220,700,170,.5)}
 <div class="pad" style="left:220px;width:320px;z-index:3"><div>2 · ${W[1][0]}<br><small>${W[1][1]} очок</small></div></div>
 <div class="pad" style="left:620px;width:360px;height:150px;z-index:3"><div>🏆 1 · ${W[0][0]}<br><small>${W[0][1]} очок</small></div></div>
 <div class="pad" style="left:1060px;width:320px;height:100px;z-index:3"><div>3 · ${W[2][0]}<br><small>${W[2][1]} очок</small></div></div>`}

// 2. Торти
function cake(k,cx,tiers,place){let s='',y=860;s+=`<div class="plate" style="left:${cx}px;top:${y-6}px;width:${tiers[0]+80}px"></div>`;
 const sp=['#f15e38','#ffc93c','#111','#7ec8ff','#fff'];
 tiers.forEach((w,t)=>{const h=tiers.length==1?205:118;y-=h;let spr='';for(let i=0;i<9;i++)spr+=`<div class="sp" style="left:${rnd(10,w-30)}px;top:${rnd(52,70)}px;background:${sp[i%5]};transform:rotate(${rnd(0,180)}deg)"></div>`;
  s+=`<div class="tier" style="left:${cx}px;top:${y}px;width:${w}px;height:${h+6}px;z-index:${3+t}"><div class="fr"></div>${spr}${t==0?`<div class="tx">${W[k][0]}<br><small>${W[k][1]} очок</small></div>`:''}</div>`});
 const tw=tiers[tiers.length-1];
 s+=`<div class="cand" style="left:${cx-tw/2+26}px;top:${y-66}px;z-index:2"></div><div class="cand" style="left:${cx+tw/2-44}px;top:${y-66}px;z-index:2"></div>`;
 const d=place==1?190:150;s+=`<div class="bob" style="left:${cx}px;top:${y-d/2+10}px;z-index:9">${em(k,0,0,d)}</div>`;
 s+=`<div class="num" style="left:${cx}px;top:${y+40}px;z-index:9">${place}</div>`;return s}
function v2(){let fl='';const fc=['#f15e38','#111','#fff','#ffc93c'];for(let i=0;i<22;i++)fl+=`<svg class="flag" viewBox="0 0 60 70" style="position:absolute;left:${10+i*74}px;top:${30+Math.sin(i/21*Math.PI)*36}px;width:60px;height:70px;animation-delay:${-i*.2}s"><path d="M2 2 H58 L30 66Z" fill="${fc[i%4]}" stroke="#111" stroke-width="5" stroke-linejoin="round"/></svg>`;
 return `<svg class="bunt" viewBox="0 0 1640 120" style="position:absolute;left:-20px;top:0;width:1640px;height:120px"><path d="M0 26 Q820 120 1640 26" fill="none" stroke="#111" stroke-width="5"/></svg>${fl}
 ${conf(40,C1)}<div class="ttl">${[...T].map((c,i)=>c==' '?'&nbsp;':`<span style="animation-delay:${i*.1}s">${c}</span>`).join('')}</div>
 ${cake(1,380,[330,250],2)}${cake(0,800,[390,310,230],1)}${cake(2,1220,[330],3)}`}

// 3. Колекційні картки
function tcard(k,x,y,w,h,rot,delay,rank){const d=Math.min(w-80,h-260);return `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg);animation-delay:${delay}s;z-index:${rank==1?6:4}"><div class="in">
 <div class="hd"><span>№${rank}</span><span>${['','ЛЕГЕНДА','СУПЕРЗІРКА','ГЕРОЇ'][rank]}</span></div>
 <div class="art"></div>${em(k,w/2,84+(h-234)/2,d)}
 <div class="nm">${W[k][0]}</div>
 <div class="stat"><span>⭐ ${W[k][1]}</span><span>${'★'.repeat(4-rank)}${'☆'.repeat(rank-1)}</span></div></div></div>`}
function v3(){return `<div class="burst"></div><div class="half"></div>
 <div class="ttl">ВІТАЄМО ПЕРЕМОЖЦІВ!</div>
 ${tcard(1,170,250,330,450,-7,1.0,2)}${tcard(0,600,180,400,540,0,1.6,1)}${tcard(2,1100,290,330,450,7,.4,3)}
 <div class="base" style="left:190px;width:300px;height:110px">2</div><div class="base" style="left:620px;width:360px;height:150px;background:var(--y)">1</div><div class="base" style="left:1110px;width:300px;height:80px">3</div>
 ${conf(30,['#f15e38','#ffc93c','#fff'])}`}

// 4. Книжки
const BN=['СЛОВНИК','ПРАВОПИС','ЧИТАНКА','ГРАМАТИКА','ФРАЗЕОЛОГІЗМИ','СИНОНІМИ','АБЕТКА','ВІРШІ'],BC=['#f15e38','#fff','#ffc93c','#1d1d1d','#ffb199','#e52a2a'];
function stack(cx,n,seed){let s='';for(let i=0;i<n;i++){const w=rnd(330,400),c=BC[(i+seed)%6];s+=`<div class="book" style="left:${cx-w/2+rnd(-14,14)}px;top:${900-58*(i+1)}px;width:${w}px;background:${c};color:${c=='#1d1d1d'||c=='#e52a2a'?'#fff':'#111'};transform:rotate(${rnd(-1.6,1.6)}deg)"><span>${BN[(i*3+seed)%8]}</span></div>`}return s}
function v4(){return `<div class="board"><div class="w">${T}</div><div class="chalk"></div></div>
 <svg class="plane" viewBox="0 0 120 60" style="position:absolute;left:0;top:250px;width:120px;height:60px;z-index:9"><path d="M2 30 L118 4 L70 56 L56 36Z" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/><path d="M56 36 L118 4" stroke="#111" stroke-width="4"/></svg>
 ${conf(30,C1)}
 ${stack(380,4,1)}${stack(800,5,0)}${stack(1220,3,4)}
 ${group(380,672,3,190,1,{jump:1})}${group(800,614,3,215,0,{jump:1,gl:1})}${group(1220,730,3,175,3,{jump:1})}
 <div class="tag" style="left:380px;top:355px">🥈 ${W[1][0]}<br><small>${W[1][1]} очок</small></div>
 <div class="tag" style="left:800px;top:262px;background:var(--o);color:#fff">🥇 ${W[0][0]}<br><small>${W[0][1]} очок</small></div>
 <div class="tag" style="left:1220px;top:428px">🥉 ${W[2][0]}<br><small>${W[2][1]} очок</small></div>`}

// 5. Полароїди
function pol(k,x,y,w,r,place,seed){const ph=w*0.78,n=3,size=ph*0.74;return `<div class="pol" style="left:${x}px;top:${y}px;width:${w}px;--r:${r}deg;animation-delay:${-seed}s;z-index:${place==1?6:4}">
 <div class="ph" style="height:${ph}px">${group((w-44)/2,ph+size*0.08,n,size,seed,{pose:i=>i==1?'up':'peace'})}</div>
 <span class="cap">${W[k][0]} · ${W[k][1]}</span><div class="pin"></div>
 <div class="stk" style="right:-40px;top:-30px">${place}</div></div>`}
function v5(){const cols=['#f15e38','#ffc93c','#fff','#1d1d1d'];
 const lt=[...T].map((c,i)=>c==' '?'&nbsp;&nbsp;':`<span class="let" style="background:${cols[i%4]};color:${i%4==3?'#fff':'#111'};transform:rotate(${(i%2?1:-1)*rnd(2,8)}deg);font-family:${i%3?'Balsamiq Sans':'Caveat'};font-size:${i%3?60:74}px">${c}</span>`).join('');
 let bl='';for(let i=0;i<30;i++)bl+=`<div class="bulb" style="left:${30+i*53}px;top:${30+Math.sin(i/29*Math.PI*3)*10}px;background:${['#ffc93c','#f15e38','#fff'][i%3]};animation-delay:${(i%2)*.5}s"></div>`;
 return `<svg viewBox="0 0 1600 60" style="position:absolute;left:0;top:10px;width:1600px;height:60px"><path d="M0 20 Q130 50 266 20 T533 20 T800 20 T1066 20 T1333 20 T1600 20" fill="none" stroke="#111" stroke-width="4"/></svg>${bl}
 <div class="ttl">${lt}</div>
 ${pol(1,150,300,340,-7,2,1)}${pol(0,605,220,390,2,1,0)}${pol(2,1110,350,320,8,3,3)}
 <div class="flash"></div><div class="frame"></div>`}

// 6. Театр
function v6(){let fw='';for(let i=0;i<16;i++)fw+=`<div class="flw" style="left:${rnd(250,1350)}px;animation-duration:${rnd(4,7)}s;animation-delay:${-rnd(0,7)+2}s;z-index:12">${['🌻','💐','⭐','🌻'][i%4]}</div>`;
 return `<div class="wall"></div><div class="floor"></div>
 <div class="stp" style="left:220px;width:320px;height:180px;z-index:3"><span class="n">2</span><span class="t">${W[1][0]} · ${W[1][1]}</span></div>
 <div class="stp" style="left:620px;width:360px;height:250px;z-index:3"><span class="n">1</span><span class="t">${W[0][0]} · ${W[0][1]}</span></div>
 <div class="stp" style="left:1060px;width:320px;height:130px;z-index:3"><span class="n">3</span><span class="t">${W[2][0]} · ${W[2][1]}</span></div>
 ${group(380,600,3,190,1,{jump:1})}${group(800,530,4,215,0,{jump:1,gl:1})}${group(1220,650,3,175,3,{jump:1})}
 <div class="spot s1"></div><div class="spot s2"></div>
 ${fw}<div class="mq">${T}</div>
 <div class="cur cl"></div><div class="cur cr"></div><div class="val"></div>`}

const V=[
{h:'1. Ракети',c:'rk',p:'Відлік «Т–0», і три ракети злітають по черзі: третє, друге, перше місце. Емблеми класів — в ілюмінаторах. Що вище місце, то вище ракета. Внизу стартові майданчики з назвами й очками.',f:v1},
{h:'2. Святкові торти',c:'ck',p:'Замість п’єдесталу три торти: у переможців триярусний, у других — двоярусний, у третіх — одноярусний. Емблема стоїть на торті, свічки мерехтять, над усім гойдається гірлянда з прапорців.',f:v2},
{h:'3. Колекційні картки',c:'tc',p:'Темний фон із променями, класи — як рідкісні картки: «Легенда», «Суперзірка», «Герої». Картки перевертаються одна за одною, по них пробігає блиск, як по голограмі.',f:v3},
{h:'4. Стоси книжок',c:'bk',p:'Аркуш у лінійку й шкільна дошка, на якій крейдою пишеться «Вітаємо переможців!». Учні у формі стрибають на стосах підручників: що вище місце, то вищий стос. Пролітає паперовий літачок.',f:v4},
{h:'5. Полароїди на корковій дошці',c:'pl',p:'Заголовок складено з вирізаних літер, як у колажі. Фото класів у формі висять на кнопках і гойдаються, спалахує фотоспалах, мерехтить гірлянда. Переможці на найбільшому фото посередині, з зірочкою «1».',f:v5},
{h:'6. Театральна сцена',c:'th',p:'Завіса розсувається, прожектори нишпорять сценою, на вивісці блимають лампочки. Учні у формі стрибають на сходинках п’єдесталу, а згори падають соняшники й зірочки.',f:v6}];
const L=document.getElementById('list');
L.innerHTML=V.map((v,i)=>`<section class="var" id="v${i+1}"><h2>${v.h}</h2><p>${v.p}</p><div class="box"><div class="scr ${v.c}">${v.f()}</div></div></section>`).join('');
function fit(){document.querySelectorAll('.box').forEach(b=>b.firstChild.style.transform=`scale(${b.clientWidth/1600})`)}
addEventListener('resize',fit);fit();
</script></body></html>
