<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Екран переможців</title>
<style>body{margin:0;background:#efeefc;font-family:"Balsamiq Sans",system-ui,sans-serif;color:#2b2840}
.wrap{max-width:1640px;margin:0 auto;padding:16px}h1{font-size:28px;margin:8px 0 4px}p{margin:0 0 16px;font-size:16px}
h2{font-size:22px;margin:24px 0 4px}.box{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:16px;box-shadow:0 8px 24px rgba(60,50,150,.18);background:#fff}
iframe{position:absolute;left:0;top:0;width:1600px;height:900px;border:0;transform-origin:0 0}</style></head><body><div class="wrap">
<h1>Екран переможців: 6 варіантів з деталей головної сторінки</h1>
<p>Справжні дані таблиці. 1–3 — з емблемами (поки біле коло з літерою), 4–6 — з учнями у шкільній формі.</p>
<div id="l"></div></div><script>
const O=[1,7,2,3,4,5,6];const H=['1. ✅ Обраний: головна-підсумок з емблемами','2. Прапор посередині, класи на картках з фестончастим краєм','3. Плитки класів: трійка — великі плитки, праворуч усі класи за місцями','4. Персикові картки «Слова години» з учнями у формі','5. Таблиця на весь екран, учні вболівають обабіч','6. П’єдестал із кнопок «Грати», учні й репліки-пігулки','7. Обраний варіант 1, запасний — з учнями у формі (якщо в когось із трійки немає емблеми)'];
document.getElementById('l').innerHTML=O.map(n=>[H[n-1],n]).map(([h,n])=>`<h2>${h}</h2><div class=box><iframe src="../index.html?win=${n}" loading="lazy"></iframe></div>`).join('');
const fit=()=>document.querySelectorAll('.box').forEach(b=>b.firstChild.style.transform=`scale(${b.clientWidth/1600})`);addEventListener('resize',fit);fit();
</script></body></html>
